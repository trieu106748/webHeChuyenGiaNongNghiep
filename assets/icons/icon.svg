<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle tech circuit / node lines -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="140" x2="180" y2="140" />
    <line x1="180" y1="140" x2="220" y2="200" />
    <line x1="432" y1="160" x2="350" y2="160" />
    <line x1="350" y1="160" x2="310" y2="220" />
    <line x1="100" y1="380" x2="200" y2="380" />
    <line x1="400" y1="380" x2="320" y2="380" />
  </g>

  <!-- Tech Dots -->
  <circle cx="80" cy="140" r="7" fill="#86efac" />
  <circle cx="220" cy="200" r="5" fill="#fef08a" />
  <circle cx="432" cy="160" r="7" fill="#86efac" />
  <circle cx="310" cy="220" r="5" fill="#fef08a" />
  <circle cx="100" cy="380" r="6" fill="#86efac" />
  <circle cx="400" cy="380" r="6" fill="#86efac" />

  <!-- Center Hexagon / Shield Badge -->
  <polygon points="256,90 380,162 380,306 256,378 132,306 132,162" 
           fill="rgba(6, 78, 59, 0.65)" 
           stroke="rgba(255, 255, 255, 0.25)" 
           stroke-width="4" />

  <!-- The Smart Plant Leaf (DSS Agriculture Icon) -->
  <path d="M 256,120 
           C 340,140 370,240 320,320 
           C 280,380 256,410 256,410 
           C 256,410 232,380 192,320 
           C 142,240 172,140 256,120 Z" 
        fill="url(#leafGrad)" 
        filter="url(#glow)" />

  <!-- Leaf Vein (AI Neural Network Branching) -->
  <path d="M 256,400 L 256,180" stroke="#064e3b" stroke-width="6" stroke-linecap="round" />
  <path d="M 256,330 C 275,310 295,300 315,305" stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 256,310 C 235,290 215,280 195,285" stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 256,260 C 280,240 295,230 310,235" stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 256,240 C 230,220 215,210 200,215" stroke="#064e3b" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Sparkle Star (AI / Intelligence) -->
  <path d="M 256,120 L 263,145 L 288,152 L 263,159 L 256,184 L 249,159 L 224,152 L 249,145 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="152" r="3" fill="#ffffff" />

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="465" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#ffffff">AGRI DSS</text>
</svg>

